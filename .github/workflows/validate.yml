name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 校验所有 skill
        run: python3 scripts/validate.py --strict

      - name: 检查 README 索引是否同步
        run: python3 scripts/update_index.py --check
